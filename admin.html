<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Painel Admin</title>

<link rel="stylesheet"
href="css/admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div id="loginTela">

<div class="login-box">

<h2>EL PRADO ADMIN</h2>

<input
type="text"
id="usuario"
placeholder="Usuário">

<input
type="password"
id="senha"
placeholder="Senha">

<button onclick="login()">
Entrar
</button>

</div>

</div>

<div id="painel"
style="display:none;">

<header>

<h2>Painel Administrativo</h2>

<button onclick="logout()">
Sair
</button>

</header>

<section class="cadastro">

<h3>Novo Produto</h3>

<input
type="text"
id="nome"
placeholder="Nome">

<select id="categoria">

<option value="burger">
Burger
</option>

<option value="combo">
Combo
</option>

<option value="porcao">
Porção
</option>

<option value="bebida">
Bebida
</option>

</select>

<input
type="number"
id="preco"
placeholder="Preço">

<input
type="text"
id="descricao"
placeholder="Descrição">

<input
type="text"
id="imagem"
placeholder="URL da Imagem">

<button onclick="salvarProduto()">
Salvar Produto
</button>

</section>

<section>

<h3>Produtos Cadastrados</h3>

<div id="listaProdutos">

</div>

</section>

</div>

<script src="js/admin.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - El Prado Burguer</title>

<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- LOGIN -->

<div id="loginTela">

    <div class="login-box">

        <h1>🍔 EL PRADO</h1>

        <p>Painel Administrativo</p>

        <input
        type="text"
        id="usuario"
        placeholder="Usuário">

        <input
        type="password"
        id="senha"
        placeholder="Senha">

        <button onclick="login()">
        Entrar
        </button>

    </div>

</div>

<!-- PAINEL -->

<div id="painel" style="display:none;">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2>🍔 EL PRADO</h2>

        <button onclick="mostrarSecao('dashboard')">
        📊 Dashboard
        </button>

        <button onclick="mostrarSecao('produtos')">
        📦 Produtos
        </button>

        <button onclick="mostrarSecao('pedidos')">
        🛒 Pedidos
        </button>

        <button
        class="btn-sair"
        onclick="logout()">

        Sair

        </button>

    </aside>

    <!-- CONTEÚDO -->

    <main class="conteudo-admin">

        <!-- DASHBOARD -->

        <section
        id="dashboard"
        class="secao-admin">

            <h2>📊 Dashboard</h2>

            <div class="cards-dashboard">

                <div class="card-dashboard">

                    <h3 id="totalPedidos">
                    0
                    </h3>

                    <p>
                    Pedidos
                    </p>

                </div>

                <div class="card-dashboard">

                    <h3 id="faturamento">
                    R$ 0,00
                    </h3>

                    <p>
                    Faturamento
                    </p>

                </div>

            </div>

        </section>

        <!-- PRODUTOS -->

        <section
        id="produtos"
        class="secao-admin"
        style="display:none;">

            <h2>📦 Produtos</h2>

            <section class="cadastro">

                <h3>Cadastrar Produto</h3>

                <input
                type="text"
                id="nome"
                placeholder="Nome do produto">

                <select id="categoria">

                    <option value="burger">
                    Burger
                    </option>

                    <option value="combo">
                    Combo
                    </option>

                    <option value="porcao">
                    Porção
                    </option>

                    <option value="bebida">
                    Bebida
                    </option>

                </select>

                <input
                type="number"
                step="0.01"
                id="preco"
                placeholder="Preço">

                <input
                type="text"
                id="descricao"
                placeholder="Descrição">

                <input
                type="text"
                id="imagem"
                placeholder="URL da imagem">

                <label>

                    <input
                    type="checkbox"
                    id="destaque">

                    Mostrar na Home

                </label>

                <br><br>

                <label>

                    <input
                    type="checkbox"
                    id="promocao">

                    Produto em Promoção

                </label>

                <br><br>

                <button
                class="btn-salvar"
                onclick="salvarProduto()">

                Salvar Produto

                </button>

            </section>

            <section class="produtos-admin">

                <h3>Produtos Cadastrados</h3>

                <div id="listaProdutos">

                </div>

            </section>

        </section>

        <!-- PEDIDOS -->

        <section
        id="pedidos"
        class="secao-admin"
        style="display:none;">

            <h2>🛒 Pedidos</h2>

            <div id="listaPedidos">

                <p>
                Nenhum pedido recebido.
                </p>

            </div>

        </section>

    </main>

</div>

<script src="admin.js"></script>

</body>
</html>

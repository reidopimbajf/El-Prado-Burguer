<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - El Prado Burguer</title>

<link rel="stylesheet" href="admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="loginTela">

<div class="login-box">

<h1>🍔 EL PRADO</h1>

<p>Painel Administrativo</p>

<input
type="text"
id="usuario"
placeholder="Usuário">

<input
type="password"
id="senha"
placeholder="Senha">

<button onclick="login()">
Entrar
</button>

</div>

</div>

<div id="painel" style="display:none;">

<header>

<h2>🍔 Painel Administrativo</h2>

<div>

<button class="btn-home"
onclick="window.open('index.html','_blank')">

Abrir Site

</button>

<button class="btn-sair"
onclick="logout()">

Sair

</button>

</div>

</header>

<section class="cadastro">

<h3>Cadastrar Produto</h3>

<input
type="text"
id="nome"
placeholder="Nome do produto">

<select id="categoria">

<option value="burger">
Burger
</option>

<option value="combo">
Combo
</option>

<option value="porcao">
Porção
</option>

<option value="bebida">
Bebida
</option>

</select>

<input
type="number"
step="0.01"
id="preco"
placeholder="Preço">

<input
type="text"
id="descricao"
placeholder="Descrição">

<input
type="text"
id="imagem"
placeholder="URL da imagem">
<label style="display:block;margin-bottom:15px;">

<input
type="checkbox"
id="destaque">

Mostrar na Home como Destaque

</label>

<button
class="btn-salvar"
onclick="salvarProduto()">

Salvar Produto

</button>

</section>

<section class="produtos-admin">

<h3>Produtos Cadastrados</h3>

<div id="listaProdutos">

</div>

</section>

</div>

<script src="admin.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cardápio | El Prado Burguer</title>

<link rel="stylesheet"
href="cardapio.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<header>

<a href="index.html" class="btn-voltar">

← Voltar

</a>

<h2>🍔 EL PRADO BURGUER</h2>

<div
class="cart-btn"
onclick="abrirCarrinho()">

🛒 <span id="contador">0</span>

</div>

</header>

<!-- CATEGORIAS -->

<section class="categorias">

<button onclick="filtrar('todos')">
Todos
</button>

<button onclick="filtrar('burger')">
🍔 Burgers
</button>

<button onclick="filtrar('combo')">
🔥 Combos
</button>

<button onclick="filtrar('porcao')">
🍟 Porções
</button>

<button onclick="filtrar('bebida')">
🥤 Bebidas
</button>

</section>

<!-- PRODUTOS -->

<section
id="produtos"
class="produtos">

</section>

<!-- MODAL PRODUTO -->

<div
id="modalProduto"
class="modal">

<div class="modal-box">

<h2 id="produtoNome"></h2>

<p id="produtoDescricao"></p>

<h3 id="produtoPreco"></h3>

<hr>

<br>

<h4>Adicionais</h4>

<label>

<input
type="checkbox"
value="Bacon Extra"
data-preco="5">

Bacon Extra (+R$ 5)

</label>

<br>

<label>

<input
type="checkbox"
value="Cheddar Extra"
data-preco="4">

Cheddar Extra (+R$ 4)

</label>

<br>

<label>

<input
type="checkbox"
value="Onion Rings"
data-preco="6">

Onion Rings (+R$ 6)

</label>

<br>

<label>

<input
type="checkbox"
value="Hambúrguer Extra"
data-preco="12">

Hambúrguer Extra (+R$ 12)

</label>

<br><br>

<textarea
id="observacao"
placeholder="Alguma observação para seu pedido?">
</textarea>

<div class="quantidade">

<button onclick="alterarQtd(-1)">
-
</button>

<span id="qtd">
1
</span>

<button onclick="alterarQtd(1)">
+
</button>

</div>

<button
class="btn-add"
onclick="adicionarCarrinho()">

Adicionar ao Carrinho

</button>

</div>

</div>

<!-- CARRINHO -->

<div
id="carrinho"
class="carrinho">

<div class="carrinho-topo">

<h2>Seu Pedido</h2>

<button onclick="fecharCarrinho()">
✖
</button>

</div>

<div id="itensCarrinho">

</div>

<div class="carrinho-footer">

<h3 id="total">
Total: R$ 0,00
</h3>

<button onclick="abrirCheckout()">

Finalizar Pedido

</button>

</div>

</div>

<!-- CHECKOUT -->

<div
id="checkout"
class="modal">

<div class="modal-box">

<h2>Finalizar Pedido</h2>

<input
type="text"
id="nome"
placeholder="Seu nome">

<input
type="text"
id="telefone"
placeholder="WhatsApp">

<input
type="text"
id="cep"
placeholder="CEP">

<input
type="text"
id="endereco"
placeholder="Rua e Número">

<input
type="text"
id="complemento"
placeholder="Complemento">

<h3>Forma de Pagamento</h3>

<select id="pagamento">

<option value="Pix">
PIX
</option>

<option value="Débito">
Cartão Débito
</option>

<option value="Crédito">
Cartão Crédito
</option>

<option value="Dinheiro">
Dinheiro
</option>

</select>

<select id="bandeira">

<option>Visa</option>

<option>Mastercard</option>

<option>Elo</option>

<option>American Express</option>

<option>Hipercard</option>

<option>Diners Club</option>

<option>Discover</option>

</select>

<input
type="text"
id="cupom"
placeholder="Cupom de desconto">

<button onclick="aplicarCupom()">

Aplicar Cupom

</button>

<br><br>

<h3 id="resumoTotal">

Total: R$ 0,00

</h3>

<button onclick="enviarWhatsApp()">

Enviar Pedido

</button>

</div>

</div>

<script src="storage.js"></script>
<script src="cardapio.js"></script>

</body>

</html>
